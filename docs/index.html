<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FlowInk</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #111;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    img.logo {
      width: 120px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 42px;
      margin: 10px 0;
    }

    p.lead {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      background: #111;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      margin: 10px;
    }

    .btn:hover {
      background: #333;
    }

    .section {
      margin-top: 60px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      text-align: left;
      margin-top: 30px;
    }

    .card {
      border: 1px solid #eee;
      padding: 20px;
      border-radius: 10px;
    }

    footer {
      margin-top: 80px;
      font-size: 14px;
      color: #888;
    }

    @media (max-width: 600px) {
      .features {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- アイコン -->
  <img src="FlowInk_icon_fixed.png" class="logo">

  <!-- タイトル -->
  <h1>FlowInk</h1>
  <p class="lead">
    画面に直接描ける、軽量オーバーレイツール
  </p>

  <!-- ボタン -->
  <a class="btn" href="https://github.com/msasa-alt/FlowInk/releases" target="_blank">
    ダウンロード
  </a>

  <a class="btn" href="https://github.com/msasa-alt/FlowInk" target="_blank">
    GitHub
  </a>

  <!-- 特長 -->
  <div class="section">
    <h2>特長</h2>

    <div class="features">
      <div class="card">
        <strong>オーバーレイ描画</strong><br>
        画面の上に直接書き込める
      </div>

      <div class="card">
        <strong>シンプル操作</strong><br>
        最小構成で直感的に使える
      </div>

      <div class="card">
        <strong>テキスト入力</strong><br>
        説明や補足も簡単に追加
      </div>

      <div class="card">
        <strong>軽量設計</strong><br>
        すぐ起動・すぐ使える
      </div>
    </div>
  </div>

  <!-- 使い方 -->
  <div class="section">
    <h2>使い方</h2>
    <p>
      ダウンロード → 解凍 → 起動するだけ
    </p>
  </div>

  <!-- フッター -->
  <footer>
    © FlowInk
  </footer>

</div>

</body>
</html>
