<!DOCTYPE html>
<!-- saved from url=(0040)https://web-sandbox.oaiusercontent.com/? -->
<html lang="ja"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowInk</title>

<style>
:root {
  --bg:#ffffff;
  --text:#111;
  --muted:#666;
  --line:#e9e9e9;
  --radius:14px;

  --toolbar-image-width:78px;
  --toolbar-col-width:120px;
  --line-len:44px;
  --dot-size:8px;
  --toolbar-stack-h:810px;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#fff;
  color:#111;
  text-align:center;
}

.container{
  max-width:1040px;
  margin:0 auto;
  padding:72px 20px;
}

.section{margin-top:72px;}

.toolbar-diagram{
  display:grid;
  grid-template-columns:120px 1fr;
  gap:34px;
  text-align:left;
}

.toolbar-image-col{
  height:var(--toolbar-stack-h);
}

.toolbar-image-col img{
  width:78px;
  display:block;
  margin:0 auto;
}

.toolbar-callouts{
  position:relative;
  height:var(--toolbar-stack-h);
}

.callout{
  position:absolute;
  left:0;
  right:0;
  transform:translateY(-50%);
  padding-left:60px;
}

.callout::before{
  content:"";
  position:absolute;
  left:0;
  top:50%;
  width:var(--line-len);
  height:2px;
  background:#cfd6df;
  opacity:0.7;
  transform:translateY(-50%) rotate(-18deg);
  transform-origin:left center;
}

.callout::after{
  content:"";
  position:absolute;
  left:calc(var(--line-len) - var(--dot-size)/2);
  top:50%;
  width:var(--dot-size);
  height:var(--dot-size);
  border-radius:50%;
  background:#b8bfc9;
  transform:translateY(-50%);
}

/* positions */
.callout.pen{top:40px;}
.callout.rect{top:121px;}
.callout.ellipse{top:202px;}
.callout.text{top:283px;}
.callout.eraser{top:364px;}
.callout.color{top:445px;}
.callout.clear{top:526px;}
.callout.ct{top:607px;}
.callout.settings{top:688px;}
.callout.exit{top:769px;}

.callout-card{
  padding:6px 0;
}

</style>
<style>html,body,#root{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;margin:0;padding:0}html,body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Oxygen,Ubuntu,Cantarell,Helvetica Neue,Arial,sans-serif!important}button,input,textarea,select{font-family:inherit}html{background-color:#fff}html.dark{background-color:#212121}html.mobileSkybridge.dark{background-color:#000}@supports (font: -apple-system-body){html.mobileSkybridge{font:-apple-system-body}}html.desktopSkybridge.dark{background-color:#1e1e1e}html.androidSkybridge,html.androidSkybridge body,html.androidSkybridge *{-webkit-tap-highlight-color:rgba(255,255,255,0)}html.androidSkybridge *::selection,html.androidSkybridge *::-moz-selection{background:#fff0;color:inherit}</style></head>

<body>
<div class="container">

<section class="section">
<h2>ツールバーの各ボタンの説明（斜め線版）</h2>

<div class="toolbar-diagram">

<div class="toolbar-image-col">
<img src="./toolbar.png">
</div>

<div class="toolbar-callouts">

<div class="callout pen"><div class="callout-card"><strong>ペン</strong><p>線を描画</p></div></div>
<div class="callout rect"><div class="callout-card"><strong>四角</strong></div></div>
<div class="callout ellipse"><div class="callout-card"><strong>円</strong></div></div>
<div class="callout text"><div class="callout-card"><strong>テキスト</strong></div></div>
<div class="callout eraser"><div class="callout-card"><strong>消しゴム</strong></div></div>
<div class="callout color"><div class="callout-card"><strong>カラー</strong></div></div>
<div class="callout clear"><div class="callout-card"><strong>クリア</strong></div></div>
<div class="callout ct"><div class="callout-card"><strong>CT</strong></div></div>
<div class="callout settings"><div class="callout-card"><strong>設定</strong></div></div>
<div class="callout exit"><div class="callout-card"><strong>終了</strong></div></div>

</div>

</div>

</section>

</div>

</body></html>
